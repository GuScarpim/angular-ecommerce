<div class="modal-angular" *ngIf="openModal">
  <div class="overlay" (click)="closeModal()"></div>

  <div class="modal">
    <button class="close" (click)="closeModal()">
      <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" height="1em" width="1em"
        xmlns="http://www.w3.org/2000/svg">
        <path
          d="M405 136.798L375.202 107 256 226.202 136.798 107 107 136.798 226.202 256 107 375.202 136.798 405 256 285.798 375.202 405 405 375.202 285.798 256z">
        </path>
      </svg>
    </button>
    <h1 class="title">{{ title }}</h1>
    <div class="content">
      <ng-container *ngFor="let fruit of fruits">
        <div *ngIf="fruit.quantity > 0" class="content-fruits">
          <fruits-items-component [src]="fruit.src" [title]="fruit.title"
            [value]="fruit.value"></fruits-items-component>
          <button-group-component [fruitId]="fruit.id" [quantity]="fruit.quantity"></button-group-component>
          <span class="value">R$ {{ numberFormated(fruit.quantity * fruit.value) }}</span>
        </div>
      </ng-container>
      <h1 *ngIf="totalQuantity === 0" class="title-not-item">
        Nenhum item foi adicionado ao carrinho
        <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 16 16" height="1em" width="1em"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1H.5zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7.354 5.646 8.5 6.793l1.146-1.147a.5.5 0 0 1 .708.708L9.207 7.5l1.147 1.146a.5.5 0 0 1-.708.708L8.5 8.207 7.354 9.354a.5.5 0 1 1-.708-.708L7.793 7.5 6.646 6.354a.5.5 0 1 1 .708-.708z">
          </path>
        </svg>
      </h1>
      <h1 *ngIf="totalQuantity > 0" class="title-total">
        Valor total: R$ {{ numberFormated(totalValue) }}
      </h1>
      <button *ngIf="totalQuantity > 0" class="button" (click)="generatePDF()">Checkout</button>
    </div>
  </div>
</div>
